<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>জুবাইল বৃষ্টি ও আবহাওয়া কেন্দ্র</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg-top: #0c1f3f;
      --bg-bottom: #050c1a;
      --card-bg: rgba(14, 30, 58, 0.88);
      --box-bg: rgba(20, 42, 78, 0.75);
      --border: rgba(56, 189, 248, 0.22);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
    }
    body.light-theme {
      --bg-top: #e0f2fe;
      --bg-bottom: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.92);
      --box-bg: rgba(241, 245, 249, 0.9);
      --border: rgba(2, 132, 199, 0.25);
      --text-main: #0f172a;
      --text-sub: #475569;
      --accent: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hind Siliguri', sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    .rain-layer {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
    }
    .drop {
      position: absolute; bottom: 100%; width: 1.5px; height: 55px;
      background: linear-gradient(to bottom, transparent, rgba(147, 197, 253, 0.4));
      animation: fall linear infinite;
    }
    @keyframes fall { to { transform: translateY(110vh); } }

    .wrap { max-width: 1180px; margin: 0 auto; padding: 14px; position: relative; z-index: 1; }

    .topbar {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 16px; gap: 10px; margin-bottom: 18px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; }
    .brand-logo {
      background: #0284c7; color: #fff; width: 30px; height: 30px;
      border-radius: 8px; display: grid; place-items: center;
    }
    .top-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tbtn {
      background: var(--box-bg); color: var(--text-main); border: 1px solid var(--border);
      padding: 5px 11px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.85rem;
    }

    .hero { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .hero-left h1 { font-size: 1.9rem; font-weight: 700; }
    .hero-left p { color: var(--text-sub); font-size: 0.92rem; margin-top: 2px; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; font-size: 0.82rem; color: var(--text-sub); }
    .pill-tag { background: var(--box-bg); border: 1px solid var(--border); padding: 3px 10px; border-radius: 20px; }
    .progress-bar { width: 100%; max-width: 360px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-top: 8px; overflow: hidden; }
    .progress-fill { height: 100%; width: 100%; background: #38bdf8; transition: width 1s linear; }

    .hero-right { text-align: right; }
    .clock-big { font-size: 2.2rem; font-weight: 700; line-height: 1.1; }
    .date-sub { font-size: 0.92rem; color: var(--text-main); }
    .tz-sub { font-size: 0.78rem; color: var(--text-sub); }

    .alert {
      background: rgba(120, 53, 15, 0.42); border: 1px solid #d97706;
      border-radius: 10px; padding: 11px 15px; margin-bottom: 10px;
      color: #fde68a; font-size: 0.9rem; line-height: 1.45;
    }

    .sec-head { font-size: 1.05rem; font-weight: 600; margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
    .sec-head small { font-weight: 400; color: var(--text-sub); font-size: 0.82rem; }

    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
    .s-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px; cursor: pointer; transition: 0.2s;
    }
    .s-card:hover, .s-card.selected { border-color: #38bdf8; box-shadow: 0 0 0 1px #38bdf8; }
    .s-title { color: #f87171; font-weight: 600; font-size: 1rem; }
    .s-temp { font-size: 2.5rem; font-weight: 700; margin: 4px 0; }
    .s-desc { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 10px; }
    .s-status {
      background: rgba(30, 58, 138, 0.45); border: 1px solid rgba(96, 165, 250, 0.3);
      padding: 7px 11px; border-radius: 8px; font-size: 0.86rem; color: #93c5fd; margin-bottom: 12px;
    }
    .s-rows { font-size: 0.85rem; color: var(--text-sub); display: flex; flex-direction: column; gap: 6px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px; }
    .s-row { display: flex; justify-content: space-between; align-items: center; }

    .badge-orange { background: #d97706; color: #fff; padding: 2px 9px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; }
    .badge-green { background: #10b981; color: #064e3b; padding: 2px 9px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; }

    .tab-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .site-tab {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text-main);
      padding: 6px 14px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.88rem;
    }
    .site-tab.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

    .detail-panel {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px; margin-bottom: 20px;
    }
    .dp-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; }
    .dp-main-temp { display: flex; align-items: center; gap: 14px; margin: 10px 0 16px; }
    .dp-icon { font-size: 3rem; }
    .dp-temp-num { font-size: 2.8rem; font-weight: 700; line-height: 1; }
    .dp-feels { color: var(--text-sub); font-size: 0.9rem; margin-top: 4px; }

    .rain-timeline {
      background: var(--box-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; margin-bottom: 16px;
    }
    .rt-title { font-weight: 600; font-size: 0.95rem; color: #7dd3fc; margin-bottom: 10px; }
    .rt-item {
      background: rgba(15, 23, 42, 0.55); border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 9px 12px; border-radius: 8px; margin-bottom: 8px;
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 0.88rem;
    }

    .metrics-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 10px; margin-bottom: 20px;
    }
    .m-box {
      background: var(--box-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; text-align: center;
    }
    .m-val { font-size: 1.15rem; font-weight: 700; margin-bottom: 3px; }
    .m-lbl { font-size: 0.78rem; color: var(--text-sub); }

    .hourly-scroll {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px;
    }
    .h-col {
      min-width: 66px; background: var(--box-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 6px; text-align: center; font-size: 0.78rem;
      display: flex; flex-direction: column; justify-content: space-between; align-items: center;
    }
    .h-bar-wrap { width: 18px; height: 65px; background: rgba(255,255,255,0.07); border-radius: 4px; display: flex; align-items: flex-end; margin: 6px 0; overflow: hidden; }
    .h-bar { width: 100%; background: #38bdf8; border-radius: 4px 4px 0 0; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.07); white-space: nowrap; }
    th { color: var(--text-sub); font-weight: 500; background: rgba(10, 22, 45, 0.6); }

    .made-by {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 24px 16px; text-align: center; margin-top: 16px;
    }
    .mb-small { font-size: 0.78rem; letter-spacing: 2px; color: var(--text-sub); margin-bottom: 6px; }
    .mb-name { font-size: 1.5rem; font-weight: 700; color: var(--accent); display: inline-flex; align-items: center; gap: 10px; }
    .flag-bd {
      display: inline-block; width: 24px; height: 15px; background: #006a4e;
      position: relative; border-radius: 2px;
    }
    .flag-bd::after {
      content: ""; position: absolute; width: 9px; height: 9px; background: #f42a41;
      border-radius: 50%; top: 3px; left: 6px;
    }
    .mb-role { font-size: 0.98rem; font-weight: 600; margin-top: 4px; }
    .mb-comp { font-size: 0.9rem; color: var(--text-sub); margin-top: 2px; }
    .footer-note { text-align: center; color: var(--text-sub); font-size: 0.8rem; margin-top: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="rain-layer" id="rainLayer"></div>

  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="brand-logo">🌧️</div>
        <span data-bn="জুবাইল বৃষ্টি ও আবহাওয়া কেন্দ্র" data-en="Jubail Rain & Weather Center">জুবাইল বৃষ্টি ও আবহাওয়া কেন্দ্র</span>
      </div>
      <div class="top-btns">
        <button class="tbtn" onclick="toggleSound()" id="soundBtn">🔇 শব্দ বন্ধ</button>
        <button class="tbtn" onclick="toggleLang()" id="langBtn">English</button>
        <button class="tbtn" onclick="loadAllData()">🔄 এখনই রিফ্রেশ</button>
        <button class="tbtn" onclick="document.body.classList.toggle('light-theme')">🌓 থিম</button>
        <button class="tbtn" onclick="window.print()">🖨️ প্রিন্ট</button>
      </div>
    </div>

    <div class="hero">
      <div class="hero-left">
